<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" role="img" aria-labelledby="t d">
  <title id="t">The idea, drawn</title>
  <desc id="d">A line drawing. A row of vines with a soil probe sits under a sun and a rain cloud. Thin lines from the sun, the cloud and the probe meet in one blue water drop, the day's watering advice. Below it, a phone sends out sound waves: the advice is spoken, so the grower does not have to look at a screen.</desc>
  <style>
    .ln { stroke: #8b8b94; stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .fn { stroke: #52525b; stroke-width: 1; fill: none; stroke-linecap: round; stroke-dasharray: 2 5; }
    .bl { stroke: #3b82f6; stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .bf { fill: #3b82f6; fill-opacity: 0.14; stroke: #3b82f6; stroke-width: 1.8; }
    .s { font: 400 13px "JetBrains Mono", Menlo, Consolas, monospace; fill: #a1a1aa; }
    .k { font: 600 14px "JetBrains Mono", Menlo, Consolas, monospace; fill: #e5e5e5; }
  </style>
  <rect width="400" height="520" fill="#050505"/>

  <!-- sun -->
  <circle class="ln" cx="62" cy="58" r="16"/>
  <path class="ln" d="M62 30 V 24 M62 92 V 86 M34 58 H 28 M96 58 H 90 M42 38 L 38 34 M82 78 L 86 82 M82 38 L 86 34 M42 78 L 38 82"/>
  <!-- cloud with rain -->
  <path class="ln" d="M300 70 H 360 A 16 16 0 0 0 352 40 A 22 22 0 0 0 312 36 A 18 18 0 0 0 300 70 Z"/>
  <path class="ln" d="M314 82 L 310 94 M330 82 L 326 94 M346 82 L 342 94"/>

  <!-- vine row: posts, wires, vines -->
  <path class="ln" d="M40 262 L 360 222"/>
  <path class="ln" d="M60 212 V 262 M150 200 V 250 M240 189 V 239 M330 178 V 226"/>
  <path class="ln" d="M60 222 L 330 188 M60 238 L 330 204"/>
  <g class="ln">
    <path d="M100 256 C 98 236 104 226 100 214 M100 224 C 110 220 116 214 118 206 M100 232 C 90 228 84 222 82 214"/>
    <path d="M195 245 C 193 225 199 215 195 203 M195 213 C 205 209 211 203 213 195 M195 221 C 185 217 179 211 177 203"/>
    <path d="M285 233 C 283 213 289 203 285 191 M285 201 C 295 197 301 191 303 183 M285 209 C 275 205 269 199 267 191"/>
  </g>
  <!-- leaves -->
  <g class="ln">
    <ellipse cx="86" cy="210" rx="7" ry="4.5" transform="rotate(-30 86 210)"/>
    <ellipse cx="114" cy="206" rx="7" ry="4.5" transform="rotate(30 114 206)"/>
    <ellipse cx="96" cy="200" rx="7" ry="4.5" transform="rotate(0 96 200)"/>
    <ellipse cx="120" cy="218" rx="7" ry="4.5" transform="rotate(50 120 218)"/>
    <ellipse cx="80" cy="220" rx="7" ry="4.5" transform="rotate(-50 80 220)"/>
    <ellipse cx="181" cy="199" rx="7" ry="4.5" transform="rotate(-30 181 199)"/>
    <ellipse cx="209" cy="195" rx="7" ry="4.5" transform="rotate(30 209 195)"/>
    <ellipse cx="191" cy="189" rx="7" ry="4.5" transform="rotate(0 191 189)"/>
    <ellipse cx="215" cy="207" rx="7" ry="4.5" transform="rotate(50 215 207)"/>
    <ellipse cx="175" cy="209" rx="7" ry="4.5" transform="rotate(-50 175 209)"/>
    <ellipse cx="271" cy="187" rx="7" ry="4.5" transform="rotate(-30 271 187)"/>
    <ellipse cx="299" cy="183" rx="7" ry="4.5" transform="rotate(30 299 183)"/>
    <ellipse cx="281" cy="177" rx="7" ry="4.5" transform="rotate(0 281 177)"/>
    <ellipse cx="305" cy="195" rx="7" ry="4.5" transform="rotate(50 305 195)"/>
    <ellipse cx="265" cy="197" rx="7" ry="4.5" transform="rotate(-50 265 197)"/>
  </g>
  <!-- grape bunches -->
  <g class="ln">
    <circle cx="112" cy="232" r="3"/><circle cx="118" cy="234" r="3"/><circle cx="115" cy="239" r="3"/>
    <circle cx="207" cy="221" r="3"/><circle cx="213" cy="223" r="3"/><circle cx="210" cy="228" r="3"/>
  </g>
  <!-- soil probe -->
  <path class="ln" d="M262 248 V 280 M256 248 H 268 V 236 H 256 Z"/>
  <path class="fn" d="M262 284 V 300"/>

  <!-- signals converge -->
  <path class="fn" d="M70 96 C 120 140 170 130 196 142"/>
  <path class="fn" d="M326 100 C 290 130 240 128 206 142"/>
  <path class="fn" d="M262 234 C 250 190 220 170 204 160"/>

  <!-- the drop -->
  <path class="bf" d="M200 128 C 210 144 218 154 218 164 A 18 18 0 0 1 182 164 C 182 154 190 144 200 128 Z"/>


  <!-- advice spoken -->
  <path class="bl" d="M200 186 V 352"/>
  <rect class="ln" x="176" y="360" width="48" height="84" rx="8"/>
  <path class="ln" d="M194 368 H 206"/>
  <path class="bl" d="M236 384 A 20 20 0 0 1 236 420 M248 374 A 34 34 0 0 1 248 430 M260 364 A 48 48 0 0 1 260 440"/>
  <path class="bl" d="M164 384 A 20 20 0 0 0 164 420 M152 374 A 34 34 0 0 0 152 430 M140 364 A 48 48 0 0 0 140 440"/>

  <text class="k" x="200" y="480" text-anchor="middle">readings in, one drop out,</text>
  <text class="k" x="200" y="500" text-anchor="middle">spoken out loud</text>
</svg>
