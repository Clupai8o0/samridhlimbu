  <title id="t">FreeRTOS task timing over one second</title>
  <desc id="d">Release times over one second of the bed monitor firmware: the mat task 100 times, the command task 20 times, the link task once, the TC3 interrupt twice. The temperature task runs every five minutes and the timer service task at priority 2 is not used.</desc>
