<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 520" width="888" height="520" role="img" aria-label="Fleet platform architecture: taxis publish telemetry over MQTT to Node-RED, which feeds the state service; riders go through a queue to autoscaled dispatch workers, which claim cars from the state service and send trips to Postgres">
