<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 356" width="900" height="356" role="img" aria-label="The scaling loop on AWS: queue backlog goes to two CloudWatch alarms; above 200 waiting messages a step policy adds one to three dispatch tasks, below 50 for two minutes another removes two, between one and six tasks">
<title>The scaling loop on AWS: queue backlog goes to two CloudWatch alarms; above 200 waiting messages a step policy adds one to three dispatch tasks, below 50 for two minutes another removes two, between one and six tasks</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b8b94"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker></defs>
<rect width="900" height="356" fill="#050505"/>
<text x="16" y="34" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa" letter-spacing="1">HOW THE TASK COUNT IS SET</text>
<rect x="16" y="56" width="214" height="216" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="123.0" y="149.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">rides queue backlog</text>
<text x="123.0" y="172.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">messages visible,</text>
<text x="123.0" y="192.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">1-minute average</text>
<path d="M230 102.0 L262 102.0" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<path d="M230 226.0 L262 226.0" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="266" y="56" width="156" height="92" rx="6" fill="#0a0a0b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="344.0" y="87.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">backlog-high</text>
<text x="344.0" y="110.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">avg &gt; 200</text>
<text x="344.0" y="130.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">for 1 min</text>
<rect x="266" y="180" width="156" height="92" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="344.0" y="211.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">backlog-low</text>
<text x="344.0" y="234.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">avg &lt; 50</text>
<text x="344.0" y="254.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">for 2 min</text>
<path d="M422 102.0 L454 102.0" fill="none" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#b)"/>
<path d="M422 226.0 L454 226.0" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="458" y="56" width="156" height="92" rx="6" fill="#0a0a0b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="536.0" y="87.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">sit314-out</text>
<text x="536.0" y="110.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">+1 to +3 tasks</text>
<text x="536.0" y="130.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">60 s cooldown</text>
<rect x="458" y="180" width="156" height="92" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="536.0" y="211.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">sit314-in</text>
<text x="536.0" y="234.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">−2 tasks</text>
<text x="536.0" y="254.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">120 s cooldown</text>
<path d="M614 102.0 L646 102.0" fill="none" stroke="#3b82f6" stroke-width="1.75" marker-end="url(#b)"/>
<path d="M614 226.0 L646 226.0" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="650" y="56" width="234" height="216" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="767.0" y="160.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">ECS desired count</text>
<text x="767.0" y="183.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">sit314-dispatch, 1 to 6</text>
<text x="16" y="312" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">Step scaling, not target tracking.</text>
<text x="16" y="334" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">+3 when the backlog passes 1,000.</text>
</svg>
