<text x="210.0" y="410.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">1 to 6 tasks, ARM64</text>
<text x="210.0" y="430.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">0.25 vCPU, own task role</text>
<path d="M384 402 L556 402" fill="none" stroke="#3b82f6" stroke-width="1.75" marker-start="url(#b)" marker-end="url(#b)"/>
<text x="470.0" y="390" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#3b82f6">state.sit314.local</text>
<text x="470.0" y="426" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">bearer token</text>
<rect x="560" y="356" width="300" height="92" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="710.0" y="387.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">state on Fargate</text>
<text x="710.0" y="410.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">2,000 cars from a snapshot</text>
<text x="710.0" y="430.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">dispatch group only</text>
<rect x="560" y="222" width="140" height="74" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="630.0" y="255.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">Cloud Map</text>
<text x="630.0" y="278.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">private DNS</text>
<rect x="720" y="222" width="140" height="74" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="790.0" y="255.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">Secrets Mgr</text>
<text x="790.0" y="278.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">token by ARN</text>
<text x="16" y="502" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">Stayed on the laptop: Mosquitto,</text>
<text x="16" y="524" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">Node-RED, monitor, trips, Postgres.</text>
</svg>
