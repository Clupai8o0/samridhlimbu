<text x="108.0" y="121.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">vehicle_sim.js</text>
<rect x="16" y="194" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="108.0" y="232.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">Mosquitto</text>
<text x="108.0" y="255.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">MQTT broker</text>
<rect x="16" y="328" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="108.0" y="355.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">Node-RED</text>
<text x="108.0" y="378.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">filter, dedupe,</text>
<text x="108.0" y="398.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">tag 1 of 9 zones</text>
<rect x="16" y="462" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="108.0" y="500.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">state service</text>
<text x="108.0" y="523.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">live state per car</text>
<rect x="16" y="596" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="108.0" y="634.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">monitor</text>
<text x="108.0" y="657.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">battery, stale</text>
<path d="M56 144 L56 190" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<text x="68" y="175" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">every 2 s</text>
<path d="M56 278 L56 324" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<text x="68" y="309" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">telemetry</text>
