<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900" role="img" aria-label="Fleet platform architecture: taxis publish telemetry over MQTT to Node-RED, which feeds the state service; riders go through a queue to autoscaled dispatch workers, which claim cars from the state service and send trips to Postgres">
<title>Fleet platform architecture: taxis publish telemetry over MQTT to Node-RED, which feeds the state service; riders go through a queue to autoscaled dispatch workers, which claim cars from the state service and send trips to Postgres</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b8b94"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker></defs>
<rect width="440" height="900" fill="#050505"/>
<text x="16" y="34" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa" letter-spacing="1.5">TELEMETRY</text>
<text x="240" y="34" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa" letter-spacing="1.5">RIDES</text>
<rect x="16" y="60" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
