<path d="M16 370.0 L6 370.0 L6 638.0 L12 638.0" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<rect x="240" y="60" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="332.0" y="98.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">riders</text>
<text x="332.0" y="121.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">rider_load.js</text>
<rect x="240" y="194" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="332.0" y="232.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">rides queue</text>
<text x="332.0" y="255.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">queue_service.js</text>
<rect x="240" y="328" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="332.0" y="366.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">autoscaler</text>
<text x="332.0" y="389.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">1 to 6 workers</text>
<rect x="240" y="462" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="332.0" y="489.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">dispatch</text>
<text x="332.0" y="512.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">claims the</text>
<text x="332.0" y="532.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">nearest free car</text>
<rect x="240" y="596" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="332.0" y="634.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">trip service</text>
<text x="332.0" y="657.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">batched inserts</text>
<rect x="240" y="730" width="184" height="84" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="332.0" y="768.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">Postgres 16</text>
<text x="332.0" y="791.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">trips table</text>
<path d="M280 144 L280 190" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<text x="292" y="175" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">request</text>
<path d="M280 278 L280 324" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<text x="292" y="309" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">backlog</text>
<path d="M280 412 L280 458" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<text x="292" y="443" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">scales</text>
<path d="M424 236.0 L434 236.0 L434 504.0 L428 504.0" fill="none" stroke="#8b8b94" stroke-width="1.75" marker-end="url(#a)"/>
<path d="M236 504.0 L204 504.0" fill="none" stroke="#3b82f6" stroke-width="1.75" marker-start="url(#b)" marker-end="url(#b)"/>
