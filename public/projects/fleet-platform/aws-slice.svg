<text x="320.0" y="158" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">answers</text>
<rect x="16" y="186" width="408" height="548" rx="10" fill="none" stroke="#2c2c31" stroke-width="1.5"/>
