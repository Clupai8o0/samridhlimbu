<text x="220.0" y="789.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">IoT Core</text>
<text x="220.0" y="812.0" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#a1a1aa">3 things, 1 cert each</text>
<text x="16" y="862" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">Stayed on the laptop: Mosquitto,</text>
<text x="16" y="884" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa">Node-RED, monitor, trips, Postgres.</text>
