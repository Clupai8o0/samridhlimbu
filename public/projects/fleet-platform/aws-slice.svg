<text x="325" y="330" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#3b82f6">send</text>
<rect x="40" y="356" width="360" height="92" rx="6" fill="#0a0a0b" stroke="#3b82f6" stroke-width="1.5"/>
<text x="220.0" y="387.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">dispatch on Fargate</text>
