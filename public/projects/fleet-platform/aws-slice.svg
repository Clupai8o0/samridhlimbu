<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 900" width="440" height="900" role="img" aria-label="The AWS slice: a load harness on the laptop sends ride requests to an SQS queue, autoscaled Fargate dispatch tasks match them against a Fargate state service found through Cloud Map, and answers return on a second SQS queue. Telemetry ingest, the monitor and Postgres stayed on the laptop.">
<title>The AWS slice: a load harness on the laptop sends ride requests to an SQS queue, autoscaled Fargate dispatch tasks match them against a Fargate state service found through Cloud Map, and answers return on a second SQS queue. Telemetry ingest, the monitor and Postgres stayed on the laptop.</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8b8b94"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/></marker></defs>
<rect width="440" height="900" fill="#050505"/>
<text x="16" y="34" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" font-weight="400" fill="#a1a1aa" letter-spacing="1">AWS, ap-southeast-2, 25–26 AUG 2026</text>
<rect x="40" y="56" width="360" height="70" rx="6" fill="#0a0a0b" stroke="#2c2c31" stroke-width="1.5"/>
<text x="220.0" y="87.0" text-anchor="middle" font-family="Manrope, 'Inter', system-ui, sans-serif" font-weight="700" font-size="19" fill="#e5e5e5">load harness</text>
