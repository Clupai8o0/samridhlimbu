<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 960" width="400" height="960" role="img" aria-labelledby="t d">
  <title id="t">GovChat pipeline, from the code</title>
  <desc id="d">Built once: crawlers and ABS metadata produce a catalogue of 2016 datasets; each dataset becomes one text, with no chunking; OpenAI text-embedding-3-small turns each text into a vector; load_vectors.py stores them in a Chroma collection. Per question: the FastAPI /query endpoint embeds the question, takes the 4 nearest datasets, writes an answer from titles and agencies only, strips figures, scores trust on five factors and saves an audit record. The Next.js frontend shows the answer, the trust factors, the datasets, a tree view and the audit record. Two blue notes mark the October 2026 changes: file-name words added to each text, and true cosine similarity.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8b94"/>
    </marker>
  </defs>
  <style>
    .h { font: 700 15px Manrope, "Helvetica Neue", Arial, sans-serif; fill: #e5e5e5; }
    .z { font: 400 12px "JetBrains Mono", Menlo, Consolas, monospace; fill: #a1a1aa; letter-spacing: 0.08em; }
    .k { font: 600 14px "JetBrains Mono", Menlo, Consolas, monospace; fill: #e5e5e5; }
    .s { font: 400 13px "JetBrains Mono", Menlo, Consolas, monospace; fill: #a1a1aa; }
    .x { font: 400 13px "JetBrains Mono", Menlo, Consolas, monospace; fill: #3b82f6; }
    .box { fill: #0a0a0b; stroke: #2a2a2e; stroke-width: 1; }
    .zone { fill: #0d0d10; }
    .gr { stroke: #8b8b94; stroke-width: 1.4; fill: none; }
  </style>
  <rect width="400" height="960" fill="#050505"/>

  <text class="h" x="20" y="30">From gov.au to an answer</text>

  <!-- built once -->
  <rect class="zone" x="10" y="48" width="380" height="494" rx="6"/>
  <text class="z" x="24" y="70">BUILT ONCE</text>

  <rect class="box" x="20" y="82" width="360" height="78" rx="4"/>
  <text class="k" x="36" y="106">1  ingest</text>
  <text class="s" x="36" y="128">gov_data_scraper.py: *.gov.au files</text>
  <text class="s" x="36" y="148">Normalizer.py: ABS dataflow metadata</text>
  <path class="gr" d="M200 160 V178" marker-end="url(#a)"/>

  <rect class="box" x="20" y="182" width="360" height="58" rx="4"/>
  <text class="k" x="36" y="206">2  datasets.csv</text>
  <text class="s" x="36" y="228">2016 datasets: ABS, Data.gov.au, Edu</text>
  <path class="gr" d="M200 240 V258" marker-end="url(#a)"/>

  <rect class="box" x="20" y="262" width="360" height="98" rx="4"/>
  <text class="k" x="36" y="286">3  one text per dataset</text>
  <text class="s" x="36" y="308">Title | Description | Agency |</text>
  <text class="s" x="36" y="326">Collected | Tags  (no chunking)</text>
  <text class="x" x="36" y="348">Oct 2026: + File: words from file name</text>
  <path class="gr" d="M200 360 V378" marker-end="url(#a)"/>

  <rect class="box" x="20" y="382" width="360" height="78" rx="4"/>
  <text class="k" x="36" y="406">4  embed</text>
  <text class="s" x="36" y="428">OpenAI text-embedding-3-small</text>
  <text class="s" x="36" y="448">(tests here: local all-MiniLM-L6-v2)</text>
  <path class="gr" d="M200 460 V478" marker-end="url(#a)"/>

  <rect class="box" x="20" y="482" width="360" height="50" rx="4"/>
  <text class="k" x="36" y="512">5  Chroma</text>
  <text class="s" x="140" y="512">collection "datasets"</text>

  <!-- per question -->
  <rect class="zone" x="10" y="560" width="380" height="390" rx="6"/>
  <text class="z" x="24" y="582">PER QUESTION</text>
  <path class="gr" d="M200 532 V590" marker-end="url(#a)"/>

  <rect class="box" x="20" y="594" width="360" height="218" rx="4"/>
  <text class="k" x="36" y="618">6  FastAPI  GET /query?q=</text>
  <text class="s" x="36" y="642">embed the question</text>
  <text class="s" x="36" y="664">take the 4 nearest datasets</text>
  <text class="x" x="36" y="686">Oct 2026: similarity = true cosine</text>
  <text class="s" x="36" y="708">answer from titles + agency only</text>
  <text class="s" x="36" y="730">swap figures for [data available]</text>
  <text class="s" x="36" y="752">trust score from 5 factors</text>
  <text class="s" x="36" y="774">save audit record under an id</text>
  <text class="s" x="36" y="796">also /similar/{id}, /audit/{id}</text>
  <path class="gr" d="M200 812 V830" marker-end="url(#a)"/>

  <rect class="box" x="20" y="834" width="360" height="98" rx="4"/>
  <text class="k" x="36" y="858">7  Next.js frontend</text>
  <text class="s" x="36" y="880">answer + Trust, Datasets,</text>
  <text class="s" x="36" y="900">Explore, Tree View tabs</text>
  <text class="s" x="36" y="920">View audit</text>
</svg>
