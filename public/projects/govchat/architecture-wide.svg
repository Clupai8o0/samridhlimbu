<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 784 500" width="784" height="500" role="img" aria-labelledby="t d">
  <title id="t">GovChat pipeline, from the code</title>
  <desc id="d">Built once: crawlers and ABS metadata produce a catalogue of 2016 datasets; each dataset becomes one text, with no chunking; OpenAI text-embedding-3-small turns each text into a vector; load_vectors.py stores them in a Chroma collection. Per question: the FastAPI /query endpoint embeds the question, takes the 4 nearest datasets, writes an answer from titles and agencies only, strips figures, scores trust on five factors and saves an audit record. The Next.js frontend shows the answer, the trust factors, the datasets, a tree view and the audit record. Two blue notes mark the October 2026 changes: file-name words added to each text, and true cosine similarity.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8b8b94"/>
    </marker>
  </defs>
  <style>
    .h { font: 700 15px Manrope, "Helvetica Neue", Arial, sans-serif; fill: #e5e5e5; }
    .z { font: 400 12px "JetBrains Mono", Menlo, Consolas, monospace; fill: #a1a1aa; letter-spacing: 0.08em; }
    .k { font: 600 14px "JetBrains Mono", Menlo, Consolas, monospace; fill: #e5e5e5; }
    .s { font: 400 13px "JetBrains Mono", Menlo, Consolas, monospace; fill: #a1a1aa; }
    .x { font: 400 13px "JetBrains Mono", Menlo, Consolas, monospace; fill: #3b82f6; }
    .box { fill: #0a0a0b; stroke: #2a2a2e; stroke-width: 1; }
    .zone { fill: #0d0d10; }
    .gr { stroke: #8b8b94; stroke-width: 1.4; fill: none; }
  </style>
  <rect width="784" height="500" fill="#050505"/>

  <!-- built once -->
  <rect class="zone" x="8" y="8" width="376" height="484" rx="6"/>
  <text class="z" x="22" y="30">BUILT ONCE</text>

  <rect class="box" x="16" y="44" width="360" height="78" rx="4"/>
  <text class="k" x="32" y="68">1  ingest</text>
  <text class="s" x="32" y="90">gov_data_scraper.py: *.gov.au files</text>
  <text class="s" x="32" y="110">Normalizer.py: ABS dataflow metadata</text>
  <path class="gr" d="M196 122 V136" marker-end="url(#a)"/>

  <rect class="box" x="16" y="140" width="360" height="58" rx="4"/>
  <text class="k" x="32" y="164">2  datasets.csv</text>
  <text class="s" x="32" y="186">2016 datasets: ABS, Data.gov.au, Edu</text>
  <path class="gr" d="M196 198 V212" marker-end="url(#a)"/>

  <rect class="box" x="16" y="216" width="360" height="98" rx="4"/>
  <text class="k" x="32" y="240">3  one text per dataset</text>
  <text class="s" x="32" y="262">Title | Description | Agency |</text>
  <text class="s" x="32" y="280">Collected | Tags  (no chunking)</text>
  <text class="x" x="32" y="302">Oct 2026: + File: words from file name</text>
  <path class="gr" d="M196 314 V328" marker-end="url(#a)"/>

  <rect class="box" x="16" y="332" width="360" height="78" rx="4"/>
  <text class="k" x="32" y="356">4  embed</text>
  <text class="s" x="32" y="378">OpenAI text-embedding-3-small</text>
  <text class="s" x="32" y="398">(tests here: local all-MiniLM-L6-v2)</text>
  <path class="gr" d="M196 410 V424" marker-end="url(#a)"/>

  <rect class="box" x="16" y="428" width="360" height="50" rx="4"/>
  <text class="k" x="32" y="458">5  Chroma</text>
  <text class="s" x="136" y="458">collection "datasets"</text>

  <!-- per question -->
  <text class="h" x="408" y="58">From gov.au to an answer</text>
  <rect class="zone" x="400" y="80" width="376" height="412" rx="6"/>
  <text class="z" x="414" y="102">PER QUESTION</text>
  <path class="gr" d="M376 453 H 404" marker-end="url(#a)"/>

  <rect class="box" x="408" y="250" width="360" height="218" rx="4"/>
  <text class="k" x="424" y="274">6  FastAPI  GET /query?q=</text>
  <text class="s" x="424" y="298">embed the question</text>
  <text class="s" x="424" y="320">take the 4 nearest datasets</text>
  <text class="x" x="424" y="342">Oct 2026: similarity = true cosine</text>
  <text class="s" x="424" y="364">answer from titles + agency only</text>
  <text class="s" x="424" y="386">swap figures for [data available]</text>
  <text class="s" x="424" y="408">trust score from 5 factors</text>
  <text class="s" x="424" y="430">save audit record under an id</text>
  <text class="s" x="424" y="452">also /similar/{id}, /audit/{id}</text>
  <path class="gr" d="M588 250 V 234" marker-end="url(#a)"/>

  <rect class="box" x="408" y="132" width="360" height="98" rx="4"/>
  <text class="k" x="424" y="156">7  Next.js frontend</text>
  <text class="s" x="424" y="178">answer + Trust, Datasets,</text>
  <text class="s" x="424" y="198">Explore, Tree View tabs</text>
  <text class="s" x="424" y="218">View audit</text>
</svg>
