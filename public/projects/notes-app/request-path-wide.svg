<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 358" width="880" height="358" role="img" aria-label="A request goes from the browser to the Next.js client, then the Express server, then MongoDB. Prometheus scrapes the server metrics and Grafana reads Prometheus."><rect width="880" height="358" fill="#050505"/><text x="16" y="30" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa" letter-spacing="1.5">ONE REQUEST, AND WHO WATCHES IT</text><rect x="16" y="50" width="230" height="56" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="76" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Browser</text><text x="32" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">token cookie, httpOnly</text><rect x="392" y="50" width="266" height="76" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="408" y="76" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Next.js 15 client :3000</text><text x="408" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">middleware guards pages</text><text x="408" y="118" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">API route reads the cookie</text><rect x="392" y="262" width="266" height="76" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="408" y="288" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Express 5 server :5000</text><text x="408" y="310" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">/server/api/notes</text><text x="408" y="330" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">JWT check, then the query</text><rect x="16" y="272" width="230" height="56" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="298" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">MongoDB</text><text x="32" y="320" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">users, notes (Mongoose)</text><line x1="248" y1="78" x2="390" y2="78" stroke="#a1a1aa" stroke-width="1.5"/><path d="M384 73 L391 78 L384 83" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="319" y="68" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa" text-anchor="middle">GET /api/notes</text><line x1="452" y1="128" x2="452" y2="260" stroke="#a1a1aa" stroke-width="1.5"/><path d="M447 254 L452 261 L457 254" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="464" y="199.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">Bearer token</text><line x1="390" y1="300" x2="248" y2="300" stroke="#a1a1aa" stroke-width="1.5"/><path d="M254 295 L247 300 L254 305" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><rect x="724" y="262" width="140" height="76" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/><text x="740" y="288" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">metrics</text><text x="740" y="310" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">/server/</text><text x="740" y="330" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">metrics</text><line x1="660" y1="300" x2="720" y2="300" stroke="#3b82f6" stroke-width="1.5"/><path d="M714 295 L721 300 L714 305" fill="none" stroke="#3b82f6" stroke-width="1.5"/><rect x="724" y="146" width="140" height="76" rx="6" fill="#0f0f11" stroke="#3b82f6" stroke-width="1.5"/><text x="740" y="172" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Prometheus</text><text x="740" y="194" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">pulls the</text><text x="740" y="214" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">metrics</text><line x1="794" y1="260" x2="794" y2="226" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M789 232 L794 225 L799 232" fill="none" stroke="#3b82f6" stroke-width="1.5"/><rect x="724" y="50" width="140" height="56" rx="6" fill="#0f0f11" stroke="#3b82f6" stroke-width="1.5"/><text x="740" y="76" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Grafana</text><text x="740" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">dashboards</text><line x1="794" y1="144" x2="794" y2="110" stroke="#3b82f6" stroke-width="1.5"/><path d="M789 116 L794 109 L799 116" fill="none" stroke="#3b82f6" stroke-width="1.5"/></svg>