<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 1002" width="480" height="1002" role="img" aria-label="The ten Jenkins stages in order, a manual approval before deploy, and a rollback when any stage fails"><rect width="480" height="1002" fill="#050505"/><text x="16" y="30" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa" letter-spacing="1.5">JENKINSFILE · STAGES IN ORDER</text><rect x="16" y="52" width="392" height="58" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="77" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">01</text><text x="66" y="77" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Checkout Code</text><text x="66" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">git branch main</text><line x1="212.0" y1="112" x2="212.0" y2="124" stroke="#a1a1aa" stroke-width="1.5"/><path d="M207.0 121 L212.0 128 L217.0 121" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><rect x="16" y="130" width="392" height="58" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="155" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">02</text><text x="66" y="155" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Lint and Test Backend</text><text x="66" y="176" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">eslint, 132 Jest tests</text><line x1="212.0" y1="190" x2="212.0" y2="202" stroke="#a1a1aa" stroke-width="1.5"/><path d="M207.0 199 L212.0 206 L217.0 199" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><rect x="16" y="208" width="392" height="58" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="233" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">03</text><text x="66" y="233" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Lint and Test Frontend</text><text x="66" y="254" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">next lint, 87 Jest tests</text><line x1="212.0" y1="268" x2="212.0" y2="280" stroke="#a1a1aa" stroke-width="1.5"/><path d="M207.0 277 L212.0 284 L217.0 277" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><rect x="16" y="286" width="392" height="58" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="311" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">04</text><text x="66" y="311" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Build and Push Docker Images</text><text x="66" y="332" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">two images, tag v1.0.BUILD_NUMBER</text><line x1="212.0" y1="346" x2="212.0" y2="358" stroke="#a1a1aa" stroke-width="1.5"/><path d="M207.0 355 L212.0 362 L217.0 355" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><rect x="16" y="364" width="392" height="58" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="389" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">05</text><text x="66" y="389" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Code Quality Analysis</text><text x="66" y="410" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">SonarCloud, server and client</text><line x1="212.0" y1="424" x2="212.0" y2="436" stroke="#a1a1aa" stroke-width="1.5"/><path d="M207.0 433 L212.0 440 L217.0 433" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><rect x="16" y="442" width="392" height="58" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="467" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">06</text><text x="66" y="467" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Snyk Security Scan</text><text x="66" y="488" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">snyk test, both apps</text><line x1="212.0" y1="502" x2="212.0" y2="514" stroke="#a1a1aa" stroke-width="1.5"/><path d="M207.0 511 L212.0 518 L217.0 511" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><rect x="16" y="520" width="392" height="58" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="545" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">07</text><text x="66" y="545" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Release Tagging</text><text x="66" y="566" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">npm version, git tag, push</text><line x1="212.0" y1="580" x2="212.0" y2="592" stroke="#a1a1aa" stroke-width="1.5"/><path d="M207.0 589 L212.0 596 L217.0 589" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><rect x="16" y="598" width="392" height="58" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/><text x="32" y="623" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#3b82f6">⏸</text><text x="66" 