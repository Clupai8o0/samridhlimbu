<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 466" width="480" height="466" role="img" aria-label="A request goes from the browser to the Next.js client, then the Express server, then MongoDB. Prometheus scrapes the server metrics and Grafana reads Prometheus."><rect width="480" height="466" fill="#050505"/><text x="16" y="30" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa" letter-spacing="1.5">ONE REQUEST, AND WHO WATCHES IT</text><rect x="16" y="50" width="290" height="56" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="76" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Browser</text><text x="32" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">token cookie, httpOnly</text><line x1="76" y1="108" x2="76" y2="148" stroke="#a1a1aa" stroke-width="1.5"/><path d="M71 142 L76 149 L81 142" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="88" y="134.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">GET /api/notes</text><rect x="16" y="150" width="290" height="76" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="176" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Next.js 15 client :3000</text><text x="32" y="198" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">middleware guards pages</text><text x="32" y="218" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">API route reads the cookie</text><line x1="76" y1="228" x2="76" y2="268" stroke="#a1a1aa" stroke-width="1.5"/><path d="M71 262 L76 269 L81 262" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><text x="88" y="254.0" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">Bearer token</text><rect x="16" y="270" width="290" height="76" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="296" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Express 5 server :5000</text><text x="32" y="318" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">/server/api/notes</text><text x="32" y="338" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">JWT check, then the query</text><line x1="76" y1="348" x2="76" y2="388" stroke="#a1a1aa" stroke-width="1.5"/><path d="M71 382 L76 389 L81 382" fill="none" stroke="#a1a1aa" stroke-width="1.5"/><rect x="16" y="390" width="290" height="56" rx="6" fill="#0f0f11" stroke="#3f3f46" stroke-width="1.5"/><text x="32" y="416" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">MongoDB</text><text x="32" y="438" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">users, notes (Mongoose)</text><rect x="324" y="270" width="140" height="76" rx="6" fill="#0b1220" stroke="#3b82f6" stroke-width="1.5"/><text x="340" y="296" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">metrics</text><text x="340" y="318" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">/server/</text><text x="340" y="338" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">metrics</text><line x1="308" y1="308" x2="320" y2="308" stroke="#3b82f6" stroke-width="1.5"/><path d="M314 303 L321 308 L314 313" fill="none" stroke="#3b82f6" stroke-width="1.5"/><rect x="324" y="150" width="140" height="76" rx="6" fill="#0f0f11" stroke="#3b82f6" stroke-width="1.5"/><text x="340" y="176" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Prometheus</text><text x="340" y="198" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">pulls the</text><text x="340" y="218" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">metrics</text><line x1="394" y1="268" x2="394" y2="230" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4"/><path d="M389 236 L394 229 L399 236" fill="none" stroke="#3b82f6" stroke-width="1.5"/><rect x="324" y="50" width="140" height="56" rx="6" fill="#0f0f11" stroke="#3b82f6" stroke-width="1.5"/><text x="340" y="76" font-family="Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#e5e5e5">Grafana</text><text x="340" y="98" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#a1a1aa">dashboards</text><line x1="394" y1="148" x2="394" y2="110" stroke="#3b82f6" stroke-width="1.5"/><path d="M389 116 L394 109 L399 116" fill="none" stroke="#3b82f6" stroke-width="1.5"/></svg>