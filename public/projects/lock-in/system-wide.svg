<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="t d">
  <title id="t">Lock-In system overview</title>
  <desc id="d">Sensors feed an Arduino Uno, which sends JSON over USB serial to the Raspberry Pi orchestrator. The orchestrator also pulls webcam stills over HTTP and asks Gemini. It publishes a snapshot to a local MQTT broker; the Flask dashboard subscribes and pushes it to the browser over Server-Sent Events. Button presses travel back the same way.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a1a1aa"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <style>
    .t { font-family: Manrope, 'Helvetica Neue', Arial, sans-serif; font-size: 17px; font-weight: 700; fill: #e5e5e5; }
    .m { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 14px; fill: #a1a1aa; }
    .k { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 14px; fill: #3b82f6; }
    .g { font-family: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace; font-size: 14px; fill: #e5e5e5; }
    .box { fill: #0a0a0b; stroke: #3f3f46; stroke-width: 1.5; }
    .hot { fill: #0a0a0b; stroke: #3b82f6; stroke-width: 1.5; }
    .zone { fill: #111114; }
    .ln { stroke: #a1a1aa; stroke-width: 1.5; fill: none; }
    .lb { stroke: #3b82f6; stroke-width: 1.5; fill: none; }
    .dash { stroke: #71717a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 5; }
  </style>
  <rect width="900" height="460" fill="#050505"/>

  <!-- desk -->
  <text class="m" x="20" y="28">ON THE DESK</text>
  <rect class="box" x="20" y="42" width="220" height="72" rx="6"/>
  <text class="t" x="36" y="68">Sensors</text>
  <text class="m" x="36" y="92">PIR · HC-SR04 · DHT22</text>
  <text class="m" x="36" y="108">LDR · push button</text>

  <line class="ln" x1="240" y1="78" x2="276" y2="78" marker-end="url(#a)"/>

  <rect class="box" x="280" y="42" width="220" height="72" rx="6"/>
  <text class="t" x="296" y="68">Arduino Uno</text>
  <text class="m" x="296" y="92">1 Hz frames, press</text>
  <text class="m" x="296" y="108">patterns, interrupts</text>

  <line class="ln" x1="500" y1="78" x2="536" y2="78" marker-end="url(#a)"/>

  <rect class="box" x="540" y="42" width="120" height="72" rx="6"/>
  <text class="t" x="556" y="68">Outputs</text>
  <text class="m" x="556" y="92">3 LEDs</text>
  <text class="m" x="556" y="108">piezo</text>

  <!-- pi zone -->
  <rect class="zone" x="10" y="190" width="880" height="142" rx="8"/>
  <text class="m" x="20" y="212">RASPBERRY PI</text>

  <!-- serial -->
  <path class="ln" d="M310 114 V146 H160 V220" marker-end="url(#a)"/>
  <path class="ln" d="M220 224 V170 H360 V118" marker-end="url(#a)"/>
  <text class="g" x="376" y="148">USB serial</text>
  <text class="m" x="376" y="166">115200 baud, JSON</text>

  <rect class="hot" x="20" y="224" width="250" height="92" rx="6"/>
  <text class="t" x="36" y="250">orchestrator.py</text>
  <text class="m" x="36" y="274">8 asyncio tasks share one</text>
  <text class="m" x="36" y="292">pure-logic FSM</text>
  <text class="k" x="180" y="292">→ SQLite</text>

  <line class="lb" x1="270" y1="254" x2="428" y2="254" marker-end="url(#b)"/>
  <text class="k" x="282" y="244">lockin/snapshot</text>
  <text class="m" x="282" y="274">2 Hz, retained</text>
  <line class="ln" x1="432" y1="296" x2="274" y2="296" marker-end="url(#a)"/>
  <text class="m" x="282" y="314">cmd</text>

  <rect class="box" x="432" y="224" width="164" height="92" rx="6"/>
  <text class="t" x="448" y="250">mosquitto</text>
  <text class="m" x="448" y="274">local MQTT broker</text>

  <line class="lb" x1="596" y1="254" x2="632" y2="254" marker-end="url(#b)"/>
  <line class="ln" x1="636" y1="296" x2="600" y2="296" marker-end="url(#a)"/>

  <rect class="box" x="636" y="224" width="244" height="92" rx="6"/>
  <text class="t" x="652" y="250">Flask dashboard</text>
  <text class="m" x="652" y="274">:8080, reads SQLite for</text>
  <text class="m" x="652" y="292">history and distractions</text>

  <!-- browser -->
  <line class="lb" x1="666" y1="316" x2="666" y2="376" marker-end="url(#b)"/>
  <text class="k" x="678" y="344">SSE /api/stream</text>
  <line class="ln" x1="850" y1="376" x2="850" y2="320" marker-end="url(#a)"/>
  <text class="m" x="838" y="368" text-anchor="end">POST /api/button</text>

  <rect class="box" x="636" y="380" width="244" height="56" rx="6"/>
  <text class="t" x="652" y="406">Browser</text>
  <text class="m" x="652" y="426">phone or laptop on the LAN</text>

  <!-- vision side inputs -->
  <text class="m" x="20" y="384">ALSO INTO THE ORCHESTRATOR</text>
  <text class="g" x="20" y="406">webcam still: HTTP GET /capture</text>
  <text class="g" x="20" y="428">focus judgment: Gemini 2.5 Flash</text>
</svg>
