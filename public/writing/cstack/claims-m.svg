<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 729" role="img" aria-labelledby="t d">
  <title id="t">Two sessions, one file</title>
  <desc id="d">Timeline in five steps. 1: session A edits a file and claims it in claude-claims.json, kept in the git common dir. 2: session B tries the same file, reads the claim and is blocked; in another worktree it would only get a warning. 3: B messages A with SendMessage and A sends one handoff: done, branch, files, tests, what is left. 4: A releases the claim. 5: B edits the file.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#8b8b93"/>
    </marker>
    <marker id="aha" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#3b82f6"/>
    </marker>
    <style>
      .m { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-ligatures: none; }
      .s { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .box { fill: #141417; stroke: #2e2e35; stroke-width: 1.2; }
      .t { fill: #ededef; }
      .mu { fill: #8b8b93; }
      .ln { fill: none; stroke: #8b8b93; stroke-width: 1.5; }
      .la { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="360" height="729" fill="#0a0a0b"/>
  <rect class="box" x="12" y="12" width="336" height="67" rx="10"/>
  <text class="m mu" x="26" y="38" font-size="13">1</text>
  <text class="m" x="46" y="38" font-size="13" fill="#3b82f6" font-weight="700">A</text>
  <text class="s t" x="68" y="38" font-size="16" font-weight="600">edits file</text>
  <circle cx="30" cy="57.5" r="4" fill="#199e70"/>
  <text class="s" x="40" y="62" font-size="13.5" fill="#199e70">claims it</text>
  <path class="ln" d="M42 79 V111" marker-end="url(#ah)"/>
  <text class="s mu" x="54" y="101.0" font-size="13">writes</text>
  <rect class="box" x="12" y="113" width="336" height="65" rx="10" style="stroke:#3b82f6"/>
  <text class="m t" x="26" y="139" font-size="15">claude-claims.json</text>
  <text class="s mu" x="26" y="163" font-size="13.5">in the git common dir</text>
  <path class="ln" d="M42 178 V210" marker-end="url(#ah)"/>
  <text class="s mu" x="54" y="200.0" font-size="13">reads</text>
  <rect class="box" x="12" y="212" width="336" height="88" rx="10" style="stroke:#d95926"/>
  <text class="m mu" x="26" y="238" font-size="13">2</text>
  <text class="m" x="46" y="238" font-size="13" fill="#c98500" font-weight="700">B</text>
  <text class="s t" x="68" y="238" font-size="16" font-weight="600">same file</text>
  <circle cx="30" cy="257.5" r="4" fill="#d95926"/>
  <text class="s" x="40" y="262" font-size="13.5" fill="#d95926">blocked</text>
  <circle cx="30" cy="278.5" r="4" fill="#c98500"/>
  <text class="s" x="40" y="283" font-size="13.5" fill="#c98500">another worktree: a warning only</text>
  <path class="ln" d="M42 300 V332" marker-end="url(#ah)"/>
  <rect class="box" x="12" y="334" width="336" height="65" rx="10"/>
  <text class="m mu" x="26" y="360" font-size="13">3</text>
  <text class="m" x="46" y="360" font-size="13" fill="#c98500" font-weight="700">B</text>
  <text class="s t" x="68" y="360" font-size="16" font-weight="600">messages A</text>
  <text class="s mu" x="26" y="384" font-size="13.5">asks for one handoff</text>
  <path class="la" d="M42 399 V431" marker-end="url(#aha)"/>
  <text class="m" x="54" y="421.0" font-size="13" fill="#3b82f6">SendMessage</text>
  <rect class="box" x="12" y="433" width="336" height="84" rx="10"/>
  <text class="m mu" x="26" y="459" font-size="13">3</text>
  <text class="m" x="46" y="459" font-size="13" fill="#3b82f6" font-weight="700">A</text>
  <text class="s t" x="68" y="459" font-size="16" font-weight="600">handoff</text>
  <text class="s mu" x="26" y="483" font-size="13.5">done, branch, files, tests,</text>
  <text class="s mu" x="26" y="502" font-size="13.5">what is left</text>
  <path class="ln" d="M42 517 V549" marker-end="url(#ah)"/>
  <rect class="box" x="12" y="551" width="336" height="65" rx="10"/>
  <text class="m mu" x="26" y="577" font-size="13">4</text>
  <text class="m" x="46" y="577" font-size="13" fill="#3b82f6" font-weight="700">A</text>
  <text class="s t" x="68" y="577" font-size="16" font-weight="600">releases</text>
  <text class="s mu" x="26" y="601" font-size="13.5">claim dropped</text>
  <path class="ln" d="M42 616 V648" marker-end="url(#ah)"/>
  <rect class="box" x="12" y="650" width="336" height="67" rx="10" style="stroke:#199e70"/>
  <text class="m mu" x="26" y="676" font-size="13">5</text>
  <text class="m" x="46" y="676" font-size="13" fill="#c98500" font-weight="700">B</text>
  <text class="s t" x="68" y="676" font-size="16" font-weight="600">edits file</text>
  <circle cx="30" cy="695.5" r="4" fill="#199e70"/>
  <text class="s" x="40" y="700" font-size="13.5" fill="#199e70">allowed</text>
</svg>
