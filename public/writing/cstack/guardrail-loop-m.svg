<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 538" role="img" aria-labelledby="t d">
  <title id="t">A failure becomes a rule</title>
  <desc id="d">A four-step loop. 1: it breaks once, for example git stash took the uncommitted work of other live sessions. 2: guardrails.py learn writes a rule into guardrails.json with the action warn, STOP, queue or deny. 3: every session checks each command and edit before it runs, in all six agents. 4: on STOP, check the case; if it applies, fix it or tell the user; if not, ack with what was checked and retry. A dashed arrow leads back to step 1 for the next failure.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#8b8b93"/>
    </marker>
    <marker id="aha" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#3b82f6"/>
    </marker>
    <style>
      .m { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-ligatures: none; }
      .s { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .box { fill: #141417; stroke: #2e2e35; stroke-width: 1.2; }
      .t { fill: #ededef; }
      .mu { fill: #8b8b93; }
      .ln { fill: none; stroke: #8b8b93; stroke-width: 1.5; }
      .la { fill: none; stroke: #3b82f6; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="360" height="538" fill="#0a0a0b"/>
  <rect class="box" x="12" y="12" width="336" height="106" rx="10" style="stroke:#d95926"/>
  <text class="m mu" x="26" y="38" font-size="13">1</text>
  <text class="s t" x="46" y="38" font-size="16" font-weight="600">It breaks once</text>
  <text class="m t" x="26" y="62" font-size="14">git stash</text>
  <text class="s mu" x="26" y="84" font-size="13.5">took the uncommitted work</text>
  <text class="s mu" x="26" y="103" font-size="13.5">of other live sessions</text>
  <path class="la" d="M42 118 V150" marker-end="url(#aha)"/>
  <rect class="box" x="12" y="152" width="336" height="115" rx="10" style="stroke:#3b82f6"/>
  <text class="m mu" x="26" y="178" font-size="13">2</text>
  <text class="s t" x="46" y="178" font-size="16" font-weight="600">It becomes a rule</text>
  <text class="m t" x="26" y="202" font-size="14">guardrails.py learn</text>
  <text class="s mu" x="26" y="224" font-size="13.5">→ guardrails.json</text>
  <rect x="26" y="230" width="48" height="26" rx="13" fill="#c98500" fill-opacity="0" stroke="#c98500" stroke-width="1.2"/>
  <text class="m" x="33" y="248" font-size="13" fill="#c98500">warn</text>
  <rect x="81.6" y="230" width="48" height="26" rx="13" fill="#d95926" fill-opacity="0.18" stroke="#d95926" stroke-width="1.2"/>
  <text class="m" x="88.6" y="248" font-size="13" fill="#d95926" font-weight="700">STOP</text>
  <rect x="137.2" y="230" width="56" height="26" rx="13" fill="#3b82f6" fill-opacity="0" stroke="#3b82f6" stroke-width="1.2"/>
  <text class="m" x="144.2" y="248" font-size="13" fill="#3b82f6">queue</text>
  <rect x="201.2" y="230" width="48" height="26" rx="13" fill="#d95926" fill-opacity="0" stroke="#d95926" stroke-width="1.2"/>
  <text class="m" x="208.2" y="248" font-size="13" fill="#d95926">deny</text>
  <path class="la" d="M42 267 V299" marker-end="url(#aha)"/>
  <rect class="box" x="12" y="301" width="336" height="84" rx="10"/>
  <text class="m mu" x="26" y="327" font-size="13">3</text>
  <text class="s t" x="46" y="327" font-size="16" font-weight="600">Every session checks</text>
  <text class="s mu" x="26" y="351" font-size="13.5">each command and edit, before</text>
  <text class="s mu" x="26" y="370" font-size="13.5">it runs, in all six agents</text>
  <path class="la" d="M42 385 V417" marker-end="url(#aha)"/>
  <rect class="box" x="12" y="419" width="336" height="107" rx="10"/>
  <text class="m mu" x="26" y="445" font-size="13">4</text>
  <text class="s t" x="46" y="445" font-size="16" font-weight="600">On STOP: check the case</text>
  <circle cx="30" cy="464.5" r="4" fill="#199e70"/>
  <text class="s" x="40" y="469" font-size="13.5" fill="#199e70">applies: fix it, or tell the user</text>
  <circle cx="30" cy="485.5" r="4" fill="#8b8b93"/>
  <text class="s" x="40" y="490" font-size="13.5" fill="#8b8b93">doesn&#x27;t: ack what was checked,</text>
  <text class="s mu" x="40" y="511" font-size="13.5">then retry</text>
  <path d="M348 498 H356 V30 H350" fill="none" stroke="#8b8b93" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ah)"/>
</svg>
