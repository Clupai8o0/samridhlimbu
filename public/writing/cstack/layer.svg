<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" role="img" aria-labelledby="t d">
  <title id="t">One source, six agents</title>
  <desc id="d">The cstack folder holds rules/CLAUDE.md, agents/*/DELTA.md, hooks, core skills, mods and model-policy.json. Claude Code gets the rules by symlink. scripts/sync-agents.py generates AGENTS.md, skill links and hook config for Codex, OpenCode, dsh (DeepSeek) and kimi. Grok Build reads Claude's files itself and gets only a DELTA.md. The same hooks run in all six agents, through the agent_hook.py adapter for the five outside CLIs.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#8b8b93"/>
    </marker>
    <marker id="aha" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M1 1 L11 6 L1 11 z" fill="#3b82f6"/>
    </marker>
    <style>
      .m { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-variant-ligatures: none; }
      .s { font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      .box { fill: #141417; stroke: #2e2e35; stroke-width: 1.5; }
      .t { fill: #ededef; }
      .mu { fill: #8b8b93; }
      .ln { fill: none; stroke: #8b8b93; stroke-width: 2; }
      .la { fill: none; stroke: #3b82f6; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="770" fill="#0a0a0b"/>

  <!-- source folder -->
  <rect class="box" x="40" y="40" width="380" height="480" rx="16" style="stroke:#3b82f6"/>
  <text class="m" x="72" y="96" font-size="34" font-weight="700" fill="#3b82f6">cstack/</text>
  <text class="m t" x="72" y="160" font-size="28">rules/CLAUDE.md</text>
  <text class="m t" x="72" y="222" font-size="28">agents/*/DELTA.md</text>
  <text class="m t" x="72" y="284" font-size="28">hooks/</text>
  <text class="m t" x="72" y="346" font-size="28">skills/_core/</text>
  <text class="m t" x="72" y="408" font-size="28">mods/</text>
  <text class="m t" x="72" y="470" font-size="28">model-policy.json</text>

  <!-- symlink to Claude Code -->
  <path class="ln" d="M420 150 H560 V90 H812" marker-end="url(#ah)"/>
  <text class="s mu" x="586" y="76" font-size="24">symlink</text>

  <!-- sync script -->
  <path class="la" d="M420 295 H462" marker-end="url(#aha)"/>
  <rect class="box" x="470" y="240" width="270" height="110" rx="14"/>
  <text class="m mu" x="492" y="282" font-size="24">scripts/</text>
  <text class="m t" x="492" y="322" font-size="28">sync-agents.py</text>
  <path class="la" d="M740 295 H812" marker-end="url(#aha)"/>
  <path class="la" d="M605 350 V530 H812" marker-end="url(#aha)"/>

  <!-- Claude Code -->
  <rect class="box" x="820" y="40" width="340" height="100" rx="14"/>
  <text class="s t" x="844" y="86" font-size="30" font-weight="600">Claude Code</text>
  <text class="s mu" x="844" y="120" font-size="24">hooks run natively</text>

  <!-- generated agents -->
  <rect class="box" x="820" y="170" width="340" height="250" rx="14"/>
  <text class="s t" x="844" y="214" font-size="30" font-weight="600">Codex</text>
  <text class="s t" x="844" y="256" font-size="30" font-weight="600">OpenCode</text>
  <text class="s t" x="844" y="298" font-size="30" font-weight="600">dsh (DeepSeek)</text>
  <text class="s t" x="844" y="340" font-size="30" font-weight="600">kimi</text>
  <text class="s mu" x="844" y="392" font-size="24">AGENTS.md, skills, hooks</text>

  <!-- Grok -->
  <rect class="box" x="820" y="460" width="340" height="140" rx="14"/>
  <text class="s t" x="844" y="506" font-size="30" font-weight="600">Grok Build</text>
  <text class="s mu" x="844" y="544" font-size="24">reads Claude's files itself</text>
  <text class="s mu" x="844" y="578" font-size="24">gets only a DELTA.md</text>

  <!-- shared hooks -->
  <path class="ln" d="M230 520 V632" marker-end="url(#ah)"/>
  <rect class="box" x="40" y="640" width="1120" height="100" rx="16"/>
  <text class="s t" x="600" y="682" font-size="30" font-weight="600" text-anchor="middle">The same hooks run in all six agents</text>
  <text class="s mu" x="600" y="718" font-size="24" text-anchor="middle">agent_hook.py adapts them for the five outside CLIs</text>
</svg>
